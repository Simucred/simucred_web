name: CI/CD Pipeline - Simucred Web

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  # =========================================================================
  # CI: testes, qualidade, build e validação do container
  # =========================================================================
  ci:
    name: CI - Testes, Qualidade e Validação do Container
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./simucred

    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: simucred/package-lock.json

      - name: 3. Instalar dependências
        run: npm ci

      # Sem continue-on-error: teste quebrado bloqueia o pipeline
      - name: 4. Executar testes com cobertura
        run: npm run test -- --no-watch --code-coverage

      - name: 5. Análise no SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./simucred
          args: >
            -Dsonar.projectKey=simucred
            -Dsonar.organization=simucred
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/simucred/lcov.info
            -Dsonar.exclusions=**/.github/**,**/node_modules/**,**/*.scss

      - name: 6. Build da imagem Docker (sem publicar)
        run: docker build -t simucred-web:${{ github.sha }} .

      # Sobe o container e confere se o front responde e se o env-config.js
      # foi gerado com as variáveis passadas
      - name: 7. Validar container (smoke test)
        run: |
          docker run -d --name web-smoke -p 4000:4000 \
            -e URL_API=http://api-smoke:8080/v1 \
            simucred-web:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/ > /dev/null; then
              echo "Front respondeu após ${i}s"
              break
            fi
            sleep 1
          done

          docker logs web-smoke
          curl -sf http://localhost:4000/ > /dev/null
          curl -sf http://localhost:4000/env-config.js | grep -q "http://api-smoke:8080/v1"
          echo "env-config.js gerado com a URL_API informada"
          docker rm -f web-smoke

      - name: 8. Guardar imagem validada para o CD
        run: docker save --output imagem-web.tar simucred-web:${{ github.sha }}

      - name: 9. Upload do artefato da imagem
        uses: actions/upload-artifact@v4
        with:
          name: imagem-web-validada
          path: simucred/imagem-web.tar
          retention-days: 1

  # =========================================================================
  # CD: publica no Docker Hub a mesma imagem validada no CI (só na main)
  # =========================================================================
  cd:
    name: CD - Publicação no Docker Hub
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 1. Download da imagem validada no CI
        uses: actions/download-artifact@v4
        with:
          name: imagem-web-validada

      - name: 2. Carregar imagem Docker
        run: docker load --input imagem-web.tar

      - name: 3. Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Tag e push da imagem no Docker Hub
        run: |
          docker tag simucred-web:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/simucred-web:${{ github.sha }}
          docker tag simucred-web:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/simucred-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/simucred-web:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/simucred-web:latest
