name: CI/CD Pipeline - Simucred Web

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

jobs:
  build-and-analyze:
    name: Build, Code Quality & Docker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./simucred

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: simucred/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests & Coverage
        run: npm run test -- --no-watch --code-coverage
        continue-on-error: true

      - name: SonarQube Analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ./simucred
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_KEY }}
            -Dsonar.organization=Simucred
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.typescript.lcov.reportPaths=coverage/simucred/lcov.info
            -Dsonar.exclusions=**/.github/**,**/node_modules/**,**/*.scss

      - name: Build Angular SSR App
        run: npm run build
