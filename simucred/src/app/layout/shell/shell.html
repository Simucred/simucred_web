<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-logo"></span>
      <div>
        <strong>Simucred</strong>
        <small>Simulação de Crédito</small>
      </div>
    </div>

    <nav>
      <a routerLink="/inicio" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z" /></svg>
        Início
      </a>
      <a routerLink="/nova-simulacao" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v8M8 12h8" /></svg>
        Nova Simulação
      </a>
      <a routerLink="/simulacoes" routerLinkActive="ativo">
        <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M9 8h6M9 12h6M9 16h4" /></svg>
        Minhas Simulações
      </a>
    </nav>

    <p class="slogan">Decisões mais inteligentes para o seu futuro financeiro.</p>
  </aside>

  <div class="conteudo">
    <header class="topbar">
      <div class="usuario">
        <button type="button" class="usuario-botao" (click)="alternarMenu()">
          <span class="avatar">{{ iniciais() }}</span>
          <span>{{ nomeUsuario() }}</span>
          <svg viewBox="0 0 24 24" class="seta"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        @if (menuAberto()) {
          <div class="usuario-menu">
            <button type="button" (click)="logout()">Sair</button>
          </div>
        }
      </div>
    </header>

    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
